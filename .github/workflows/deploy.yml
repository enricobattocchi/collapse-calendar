# Builds both sites and deploys them to Cloudflare (Workers static assets, the current form of Pages):
#   _site/calendar -> worker "collapse-calendar" (collapse-calendar.lopo.it)
#   _site/status   -> worker "society-status"    (society-status.lopo.it)
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account > Workers Scripts > Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node scripts/build.mjs
      - name: Render social preview images
        run: node scripts/og.mjs
      - name: Deploy the calendar
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler/calendar.jsonc
      - name: Deploy the status page
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler/status.jsonc
