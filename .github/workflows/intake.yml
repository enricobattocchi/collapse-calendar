# Receives the branches that the daily routine pushes (claude/entry-YYYY-MM-DD).
# Safe entries go straight to main and deploy; anything else becomes a pull request
# assigned to the repository owner, which triggers a GitHub notification.
#
# Security: the routine reads untrusted web content, so nothing from its branch is executed.
# - This workflow runs on workflow_run, so its definition always comes from main.
# - It checks out main, copies in only the branch's added or modified entries/*.json blobs,
#   and runs main's validator, review gate and build on them.
# - Auto-publish commits exactly those validated files onto main; it never merges the branch.
name: Intake daily entry

on:
  workflow_run:
    workflows: ["Entry pushed"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: intake-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  intake:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate the branch name and commit
        run: |
          [[ "$BRANCH" =~ ^claude/entry-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Unexpected branch name"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Unexpected commit"; exit 1; }

      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy the branch's entry files into the trusted tree
        run: |
          git fetch origin "$SHA"
          git diff --name-status --no-renames "origin/main...$SHA" > "$RUNNER_TEMP/changes.txt"
          cat "$RUNNER_TEMP/changes.txt"
          : > "$RUNNER_TEMP/files.txt"
          while IFS=$'\t' read -r status path; do
            case "$status" in A|M) ;; *) continue ;; esac
            [[ "$path" =~ ^entries/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$ ]] || continue
            # Only regular files: a symlink or other mode makes the gate fail later.
            mode=$(git ls-tree "$SHA" -- "$path" | cut -d' ' -f1)
            if [ "$mode" != "100644" ]; then echo "X	$path" >> "$RUNNER_TEMP/changes.txt"; continue; fi
            git show "$SHA:$path" > "$path"
            echo "$path" >> "$RUNNER_TEMP/files.txt"
          done < <(cat "$RUNNER_TEMP/changes.txt")

      - name: Decide whether the entry needs review
        id: gate
        run: node scripts/review-gate.mjs < "$RUNNER_TEMP/changes.txt"

      - name: Check that the site still builds
        run: node scripts/build.mjs

      - name: Publish automatically
        if: steps.gate.outputs.auto == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -a "$RUNNER_TEMP/files.txt" git add --
          git commit -m "Publish ${BRANCH#claude/entry-}"
          git push origin main
          git push origin --delete "$BRANCH"
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref main

      - name: Ask the owner for review
        if: steps.gate.outputs.auto != 'true'
        env:
          REASONS: ${{ steps.gate.outputs.reasons }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create needs-review --color d93f0b --description "Waiting for the owner's OK" 2>/dev/null || true
          {
            echo "The daily routine drafted a door that needs your OK before it goes live."
            echo
            echo "**Why:**"
            echo "$REASONS"
            echo
            echo "- To publish, merge this pull request."
            echo "- To fix it first, edit the JSON file in this pull request, then merge."
            echo "- To skip the day, close the pull request. The watchdog then opens an issue about the missing door."
          } > "$RUNNER_TEMP/body.md"
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Door for ${BRANCH#claude/entry-} needs review" \
              --body-file "$RUNNER_TEMP/body.md" \
              --label needs-review --assignee "$OWNER"
          fi
